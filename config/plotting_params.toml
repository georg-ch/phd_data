# Filter Obergrenze fuer Gender-Regression
end_year = 2026

# Zielordner fuer die erzeugten HTML-Plots.
out_folder = "int_plots"
# Basisname fuer die Gender-Regression-Ausgaben.
out_name = "regression"

# Unter dieser Gruppengroesse werden seltene Kategorien in der Gender-Regression zusammengefasst.
small_group_cutoff = 10

# Spalten, in denen diese Zusammenfuehrung aktiv ist.
merge_cols = [
  "institute_name",
  "pba_type",
  "phd_subject",
  "subject_group_stala",
]

[regression_features]
# Zielordner fuer die erzeugten HTML-Plots.
out_folder = "int_plots"
# Basisname fuer die Feature-Vergleichsplots.
out_name = "regression_features"
# Beschriftung der x-Achse in den Feature-Performance-Plot.
x_label = "Merkmal"
# Beschriftung der y-Achse in den Feature-Performance-Plot.
y_label = "Effektgröße (part. R²)"
# Features, die in diesem Plot ausgeblendet werden.
omitted_features = ["pba_grade_missing"]

[regression_features.feature_label_names]
# Anzeigename fuer das betreffende Feature im Plot.
institute_name = "Institut"
# Anzeigename fuer das betreffende Feature im Plot.
pba_category = "PBA-Kategorie"
# Anzeigename fuer das betreffende Feature im Plot.
is_male = "Männlich"
# Anzeigename fuer das betreffende Feature im Plot.
pba_grade = "PBA-Note"
# Anzeigename fuer das betreffende Feature im Plot.
pba_grade_missing = "PBA-Note fehlt"
# Anzeigename fuer das betreffende Feature im Plot.
pba_type = "PBA-Typ"

[catcontrast_violins]
# Zielvariable fuer die Violin-Vergleiche.
target_column = "duration_computed"
# Transformation der Zielvariable vor der Modellierung.
target_transform = "log"
# Ob die Plotdaten mit Hilfsdaten angereichert werden sollen.
augment_for_plotting = true
# Spalte mit den p-Werten im Kontrast-CSV; Werte <= `significance_level` gelten als signifikant.
significance_column = "p_adj"
# Schwelle fuer die Signifikanzmarkierung im Violin-/Forest-Plot.
significance_level = 0.05
# Obergrenze fuer die y-Achse, wenn lange Zeiten abgeschnitten werden.
cutoff_years = 10
# Ab dieser Anzahl von Kategorien wird die dichte Violin-Darstellung verwendet.
dense_violin_min_levels = 8
# Breite der Violine im dichten Modus.
dense_violin_width = 1.1
# Breite des Box-Overlays im dichten Modus.
dense_box_width = 0.18
# Erzwingt die dichte Violin-Darstellung auch bei wenigen Kategorien.
always_dense_violin_style = true
# Soll die Forest-Overlay-Ansicht ueber der Violine angezeigt werden.
show_forest_overlay = true
# Horizontaler Versatz der Forest-Overlay-Punkte im dichten Modus.
forest_dense_offset = 0.24
# Reserviert fuer einen x-Achsentitel; die Kategorien werden aktuell direkt ueber die Tick-Labels gezeigt.
x_label = ""
# Beschriftung der y-Achse.
y_label = "Dauer (Jahre)"
# Zielordner fuer die erzeugten HTML-Plots.
out_folder = "int_plots"
# Basisname fuer die erzeugten Plots.
out_name = "catcontrast_violins"
[catcontrast_violins.category_replacements]
# Ersetzungsregeln fuer Kategoriebezeichnungen im Plot.
pba_category = { "GER" = "Deutschland", "NEU" = "nicht-EU", "TUB" = "TU Berlin" }

[catcontrast_violins.feature_label_names]
# Anzeigename fuer das betreffende Feature im Plot.
institute_name = "Institut"
# Anzeigename fuer das betreffende Feature im Plot.
pba_category = "PBA-Kategorie"
# Anzeigename fuer das betreffende Feature im Plot.
is_male = "Männlich"
# Anzeigename fuer das betreffende Feature im Plot.
pba_grade_missing = "Notenstatus"
# Anzeigename fuer das betreffende Feature im Plot.
pba_type = "PBA-Typ"
