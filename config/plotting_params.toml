[duration_densities]
# Nutzt Modell statt Rohdaten fuer die LinkedIn-Dauer, aber nur wenn die Modellkurve nicht ohnehin gemeinsam mit LinkedIn gezeigt wird.
use_model = false
# Zeigt LinkedIn- und Modellkurve gemeinsam an.
show_linkedin_and_model = true
# Schwellwert in Jahren fuer die Auswahl, ob die CI-Schaetzung in die Modellkurve eingeht. 1000: alle Daten (dies ist, was wir nutzen!)
ci_threshold = 1000
# Welche CI-Variante fuer die Durations-Schätzung verwendet wird. Irrelevant bei CI_threshold = 1000
ci_mode = "double_long_side"
# Erzwingt die kompakte Violin-Darstellung auch fuer wenige Kategorien.
always_dense_violin_style = true
# Breite der Violine im kompakten Modus.
dense_violin_width = 0.5
# Breite des Box-Overlays im kompakten Modus.
dense_box_width = 0.12
# Spiegelt nur die LinkedIn-Violine.
flip_linkedin_violin = true
# Skaliert Violine und Box der LinkedIn-Reihe, wenn LinkedIn und Modell gemeinsam gezeigt werden.
linkedin_violin_scale = 0.9
# Zielordner fuer die erzeugten HTML-Plots.
out_folder = "int_plots"
# Dateiname des erzeugten Plots.
out_name = "total_dur_densities"

